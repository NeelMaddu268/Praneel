:root{
  --carbon-950:#08080c; --carbon-900:#0d0d13; --carbon-850:#11111a; --carbon-800:#16161f;
  --carbon-700:#1f1f2b; --carbon-600:#2a2a38; --carbon-500:#3d3d4d;
  --carbon-400:#7d7d92; --carbon-300:#9a9aac; --carbon-200:#b4b4c6;
  --neon-400:#4deaff; --neon-500:#00d9ff;
  --red-400:#ff5468; --red-500:#ff2743;
  --amber-400:#ffc247; --amber-500:#ffb020;
  --ink:#e8e8f0;
  --display:'Orbitron',ui-sans-serif,system-ui,sans-serif;
  --body:'Rajdhani',ui-sans-serif,system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}

body{margin:0; background-color:var(--carbon-950)}

/* Full-bleed stage: this page commits to one dark racing world in every viewer theme.
   The weave lives on .wrap (not a z-index:-1 layer) so it always paints under the
   content no matter what ground the host page sets. */
.wrap{
  background-color:var(--carbon-950);
  background-attachment:fixed;
  background-image:
    radial-gradient(ellipse 120% 80% at 50% -10%, rgba(0,217,255,.07), transparent 55%),
    radial-gradient(ellipse 100% 60% at 50% 110%, rgba(255,39,67,.05), transparent 60%),
    linear-gradient(27deg,#0c0c11 5px,transparent 5px),
    linear-gradient(207deg,#0c0c11 5px,transparent 5px),
    linear-gradient(27deg,#0a0a0f 5px,transparent 5px),
    linear-gradient(207deg,#0a0a0f 5px,transparent 5px),
    linear-gradient(90deg,#0e0e14,#0e0e14);
  background-size:100% 100%,100% 100%,10px 10px,10px 10px,10px 10px,10px 10px,100% 100%;
  background-position:0 0,0 0,0 2px,5px 7px,5px 2px,0 7px,0 0;
  font-family:var(--body); color:var(--ink);
  min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:2rem 1rem; -webkit-font-smoothing:antialiased;
}
.game{width:100%; max-width:42rem}

/* ---------- header ---------- */
.hd{text-align:center; margin-bottom:1.75rem}
.eyebrow{
  display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:.5rem;
  font-family:var(--display); font-size:.625rem; letter-spacing:.4em; text-transform:uppercase;
  color:rgba(77,234,255,.8);
}
.eyebrow svg{width:1.15rem;height:1.15rem;color:var(--neon-400)}
.eyebrow svg:last-child{transform:scaleX(-1)}
h1{
  font-family:var(--display); font-size:clamp(2rem,9vw,3.25rem); font-weight:900;
  letter-spacing:.12em; text-transform:uppercase; margin:0; text-wrap:balance;
  background:linear-gradient(90deg,var(--neon-400),#fff,var(--neon-400));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 20px rgba(0,217,255,.35));
}
.sub{margin:.5rem 0 0; font-size:1.0625rem; font-weight:500; color:var(--carbon-200)}

/* ---------- code vault ---------- */
.vault{
  border:1px solid rgba(42,42,56,.8); border-radius:.75rem; background:rgba(13,13,19,.7);
  padding:1rem .75rem; margin-bottom:1.5rem; backdrop-filter:blur(4px);
}
.vault-label{
  display:flex; align-items:center; justify-content:center; gap:.5rem; margin-bottom:.75rem;
  font-family:var(--display); font-size:.625rem; letter-spacing:.3em; text-transform:uppercase;
  color:var(--carbon-300);
}
.vault-label svg{width:.875rem;height:.875rem}
.code{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.5rem .375rem}
.seg-grp{display:flex; align-items:center; gap:.375rem}
.seg{
  font-family:var(--display); font-size:.8125rem; font-weight:700; letter-spacing:.14em;
  font-variant-numeric:tabular-nums; padding:.375rem .5rem; border-radius:.375rem;
  border:1px solid var(--carbon-600); background:var(--carbon-850); color:var(--carbon-400);
}
.seg.on{
  border-color:rgba(0,217,255,.6); background:rgba(0,217,255,.1);
  color:var(--neon-400); text-shadow:0 0 10px rgba(0,217,255,.75);
}
.dash{font-family:var(--display); font-weight:700; font-size:.875rem; color:var(--carbon-400)}
.dash.on{color:var(--neon-500)}
@media(min-width:640px){
  .seg{font-size:1rem;padding:.375rem .625rem}
  .dash{font-size:1.125rem}
  .code{gap:.5rem}
  .seg-grp{gap:.5rem}
}

/* ---------- progress lights ---------- */
.lights{display:flex; align-items:center; justify-content:center; gap:.75rem; margin-bottom:1.5rem}
.light-col{display:flex; flex-direction:column; align-items:center; gap:.375rem}
.bulb{
  width:.875rem; height:.875rem; border-radius:9999px;
  border:1px solid var(--carbon-600); background:var(--carbon-800);
  transition:all .5s ease;
}
.bulb.done{border-color:var(--neon-400); background:var(--neon-500); box-shadow:0 0 10px rgba(0,217,255,.8)}
.bulb.now{border-color:rgba(0,217,255,.7); background:rgba(0,217,255,.3); animation:light-pulse 1.4s ease-in-out infinite}
.light-col span{font-family:var(--display); font-size:.5625rem; letter-spacing:.15em; color:var(--carbon-400)}
.light-col.lit span{color:rgba(77,234,255,.9)}

/* ---------- question card ---------- */
.card{
  position:relative; overflow:hidden; border-radius:1rem; border:1px solid rgba(42,42,56,.8);
  background:rgba(13,13,19,.8); backdrop-filter:blur(4px); box-shadow:0 0 40px rgba(0,0,0,.5);
}
.card.err{border-color:rgba(255,39,67,.7); box-shadow:0 0 30px rgba(255,39,67,.15)}
.card.danger{border-color:var(--red-500); animation:warn-pulse 1.15s ease-in-out infinite}
.speedline{position:relative; height:3px; background:var(--carbon-800); overflow:hidden}
.speedline i{
  position:absolute; inset:0 auto; height:100%; width:33%;
  background:linear-gradient(90deg,transparent,var(--neon-500),transparent);
  animation:speedline 2.6s linear infinite;
}
.card.danger .speedline i{background:linear-gradient(90deg,transparent,var(--red-500),transparent)}
.card-body{padding:1.25rem}
@media(min-width:640px){.card-body{padding:2rem}}

.meta{display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:1rem}
.chip{
  display:inline-flex; align-items:center; gap:.5rem; padding:.25rem .625rem; border-radius:.25rem;
  font-family:var(--display); font-size:.625rem; font-weight:700; letter-spacing:.25em; text-transform:uppercase;
  border:1px solid rgba(0,217,255,.4); background:rgba(0,217,255,.1); color:var(--neon-400);
}
.chip.danger{border-color:rgba(255,39,67,.6); background:rgba(255,39,67,.1); color:var(--red-400)}
.chip svg{width:.875rem;height:.875rem}
.counter{font-family:var(--display); font-size:.625rem; letter-spacing:.3em; text-transform:uppercase; color:var(--carbon-300)}

.warnbox{margin-bottom:1.25rem; border:1px solid rgba(255,39,67,.7); background:rgba(255,39,67,.1); border-radius:.5rem; padding:1rem}
.warnhd{display:flex; align-items:center; gap:.5rem; margin-bottom:.375rem}
.warnhd svg{width:1.25rem;height:1.25rem;flex-shrink:0;color:var(--red-400);animation:warn-blink .9s steps(2,jump-none) infinite}
.warnhd b{
  font-family:var(--display); font-size:.75rem; font-weight:900; letter-spacing:.25em;
  text-transform:uppercase; color:var(--red-400); animation:warn-blink .9s steps(2,jump-none) infinite;
}
.warnbox p{margin:0; font-size:.9375rem; font-weight:600; line-height:1.35; color:rgba(255,84,104,.95)}
.warnbox u{font-weight:900}

.prompt{margin:0 0 1.25rem; font-size:1.25rem; line-height:1.35; font-weight:700; color:#fff; text-wrap:balance}
.prompt:focus{outline:none}
@media(min-width:640px){.prompt{font-size:1.5rem}}

/* photo slot for the car question */
.photo{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.625rem;
  height:11rem; margin-bottom:1.25rem; border-radius:.5rem; position:relative;
  border:1px dashed var(--carbon-600); background:var(--carbon-850); color:var(--carbon-300);
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px);
}
@media(min-width:640px){.photo{height:13rem}}
.photo svg{width:2rem;height:2rem}
.photo b{font-family:var(--display); font-size:.625rem; letter-spacing:.2em; text-transform:uppercase}
.photo span{font-size:.9375rem; text-align:center; padding:0 1.5rem; max-width:34ch}
.photo::before,.photo::after{
  content:''; position:absolute; width:14px; height:14px; border:2px solid rgba(0,217,255,.4);
}
.photo::before{top:8px;left:8px;border-right:0;border-bottom:0}
.photo::after{bottom:8px;right:8px;border-left:0;border-top:0}
.photo img{max-height:100%;max-width:100%;object-fit:contain;border-radius:.5rem}

/* ---------- answers ---------- */
.opts{display:flex; flex-direction:column; gap:.625rem}
.opt{
  display:flex; align-items:center; gap:.75rem; width:100%; text-align:left; cursor:pointer;
  padding:.875rem 1rem; border-radius:.5rem; font-family:var(--body);
  font-size:1.0625rem; font-weight:600; transition:all .2s ease;
  border:1px solid var(--carbon-600); background:var(--carbon-850); color:var(--carbon-200);
}
.opt:hover:not(:disabled){border-color:var(--carbon-400); background:var(--carbon-800); color:#fff}
.opt[aria-pressed="true"]{
  border-color:rgba(0,217,255,.8); background:rgba(0,217,255,.1); color:#fff;
  box-shadow:0 0 18px rgba(0,217,255,.2);
}
.opt:disabled{cursor:default}
.opt kbd{
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  width:1.75rem; height:1.75rem; border-radius:.25rem; font-family:var(--display);
  font-size:.75rem; font-weight:700; border:1px solid var(--carbon-500); color:var(--carbon-300);
}
.opt[aria-pressed="true"] kbd{border-color:var(--neon-400); background:rgba(0,217,255,.2); color:var(--neon-400)}
.opt:hover:not(:disabled) kbd{border-color:var(--carbon-300)}
@media(min-width:640px){.opt{font-size:1.125rem}}

.answer{
  width:100%; padding:.875rem 1rem; border-radius:.5rem; font-family:var(--body);
  font-size:1.125rem; font-weight:600; color:#fff; transition:all .2s ease;
  border:1px solid var(--carbon-600); background:rgba(8,8,12,.8);
}
.answer::placeholder{color:var(--carbon-400)}
.answer:focus{outline:none; border-color:var(--neon-500); box-shadow:0 0 20px rgba(0,217,255,.15)}
.answer.danger{border-color:rgba(255,39,67,.7)}
.answer.danger:focus{border-color:var(--red-400); box-shadow:0 0 20px rgba(255,39,67,.25)}

.go{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem; width:100%;
  margin-top:.75rem; padding:.875rem 1.5rem; border-radius:.5rem; cursor:pointer;
  font-family:var(--display); font-size:.8125rem; font-weight:700; letter-spacing:.2em;
  text-transform:uppercase; transition:all .2s ease;
  border:1px solid rgba(0,217,255,.7); background:rgba(0,217,255,.1); color:var(--neon-400);
}
.go:hover:not(:disabled){background:rgba(0,217,255,.2); box-shadow:0 0 24px rgba(0,217,255,.3)}
.go:active:not(:disabled){transform:scale(.99)}
.go:disabled{cursor:not-allowed; border-color:var(--carbon-600); background:var(--carbon-850); color:var(--carbon-400); box-shadow:none}
.go svg{width:1rem;height:1rem}
.go.danger{border-color:rgba(255,39,67,.8); background:rgba(255,39,67,.1); color:var(--red-400)}
.go.danger:hover:not(:disabled){background:rgba(255,39,67,.2); box-shadow:0 0 24px rgba(255,39,67,.3)}
form{display:flex; flex-direction:column; gap:0}

/* ---------- feedback ---------- */
.fb{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.5rem; margin-top:1rem; min-height:1.75rem}
.status{display:inline-flex; align-items:center; gap:.5rem; font-size:1rem; font-weight:700}
.status svg{width:1rem;height:1rem}
.status.good{color:var(--neon-400)}
.status.bad{color:var(--red-400)}
.hintbtn{
  display:inline-flex; align-items:center; gap:.375rem; cursor:pointer; padding:.125rem .25rem;
  border:0; background:none; font-family:var(--body); font-size:.9375rem; font-weight:600;
  color:rgba(255,194,71,.9); transition:color .2s;
}
.hintbtn:hover{color:var(--amber-400)}
.hintbtn svg{width:1rem;height:1rem}
.hint{
  margin-top:.5rem; padding:.75rem 1rem; border-radius:.5rem; font-size:.9375rem; font-weight:500;
  border:1px solid rgba(255,176,32,.4); background:rgba(255,176,32,.05); color:rgba(255,194,71,.95);
  animation:slide-fade-in .5s cubic-bezier(.22,1,.36,1) both;
}

.foot{margin-top:1.5rem; text-align:center}
.foot p{margin:0; font-family:var(--display); font-size:.5625rem; letter-spacing:.35em; text-transform:uppercase; color:var(--carbon-400)}

/* ---------- victory ---------- */
.win{
  position:relative; overflow:hidden; border-radius:1rem; padding:1.5rem;
  border:1px solid rgba(0,217,255,.4); background:rgba(13,13,19,.8);
  box-shadow:0 0 60px rgba(0,217,255,.15); backdrop-filter:blur(4px);
  animation:slide-fade-in .5s cubic-bezier(.22,1,.36,1) both;
}
@media(min-width:640px){.win{padding:2.5rem}}
.win-inner{position:relative; display:flex; flex-direction:column; align-items:center; gap:1.25rem; text-align:center}
.trophies{display:flex; align-items:center; gap:.75rem}
.trophies svg:first-child,.trophies svg:last-child{width:1.75rem;height:1.75rem;color:var(--neon-400)}
.trophies svg:last-child{transform:scaleX(-1)}
.trophies .cup{width:3rem;height:3rem;color:var(--amber-400);filter:drop-shadow(0 0 14px rgba(255,176,32,.6))}
.win h2{
  margin:0; font-family:var(--display); font-size:clamp(1.5rem,7vw,2.25rem); font-weight:900;
  letter-spacing:.18em; text-transform:uppercase; color:var(--neon-400);
  animation:victory-glow 2.2s ease-in-out infinite;
}
.win .lede{margin:.5rem 0 0; font-size:1.0625rem; font-weight:500; color:var(--carbon-200); text-wrap:balance}
.win-code{
  width:100%; padding:1.25rem .75rem; border-radius:.75rem;
  border:1px solid rgba(0,217,255,.5); background:rgba(8,8,12,.8);
  box-shadow:inset 0 0 30px rgba(0,217,255,.08);
}
/* keep all five segments on one line inside the narrower victory panel */
@media(min-width:640px){
  .win-code{padding:1.25rem .75rem}
  .win-code .seg{font-size:.9375rem;padding:.375rem .5rem}
  .win-code .code{gap:.5rem .25rem}
  .win-code .seg-grp{gap:.25rem}
}
.copy{
  display:inline-flex; align-items:center; gap:.625rem; cursor:pointer;
  padding:.875rem 1.5rem; border-radius:.5rem; font-family:var(--display);
  font-size:.8125rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  border:1px solid rgba(0,217,255,.7); background:rgba(0,217,255,.1); color:var(--neon-400);
  transition:all .3s ease;
}
.copy:hover{background:rgba(0,217,255,.2); box-shadow:0 0 24px rgba(0,217,255,.35)}
.copy:active{transform:scale(.98)}
.copy.done{border-color:rgba(52,211,153,.7); background:rgba(52,211,153,.1); color:#6ee7b7}
.copy svg{width:1rem;height:1rem}
.win .outro{margin:0; font-size:.9375rem; color:var(--carbon-300)}
.sparks{position:absolute; inset:0; pointer-events:none}
.spark{position:absolute; bottom:0; border-radius:9999px; animation:spark-rise linear infinite}

:where(button,input,[tabindex]):focus-visible{outline:2px solid var(--neon-400); outline-offset:2px}

/* ---------- motion ---------- */
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-10px)}30%{transform:translateX(9px)}45%{transform:translateX(-7px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(2px)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes seg-reveal{0%{transform:scale(.6) rotateX(90deg);opacity:0;filter:brightness(3)}55%{transform:scale(1.12) rotateX(0);opacity:1;filter:brightness(2.2)}100%{transform:scale(1) rotateX(0);opacity:1;filter:brightness(1)}}
.seg.new{animation:seg-reveal .7s cubic-bezier(.22,1.4,.36,1) both}
@keyframes slide-fade-in{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:translateY(0)}}
.fade{animation:slide-fade-in .5s cubic-bezier(.22,1,.36,1) both}
@keyframes warn-pulse{0%,100%{border-color:rgba(255,39,67,.9);box-shadow:0 0 0 1px rgba(255,39,67,.35),0 0 28px rgba(255,39,67,.28),inset 0 0 22px rgba(255,39,67,.07)}50%{border-color:rgba(255,39,67,.35);box-shadow:0 0 0 1px rgba(255,39,67,.1),0 0 6px rgba(255,39,67,.1)}}
@keyframes warn-blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes light-pulse{0%,100%{box-shadow:0 0 6px rgba(0,217,255,.7),0 0 18px rgba(0,217,255,.35)}50%{box-shadow:0 0 2px rgba(0,217,255,.3)}}
@keyframes victory-glow{0%,100%{text-shadow:0 0 12px rgba(0,217,255,.85),0 0 44px rgba(0,217,255,.4)}50%{text-shadow:0 0 6px rgba(0,217,255,.5),0 0 20px rgba(0,217,255,.2)}}
@keyframes spark-rise{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:1}100%{transform:translateY(-46vh) scale(.2);opacity:0}}
@keyframes speedline{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="wrap"><div class="game" id="game"></div></div>

<script>
(function(){
"use strict";

// ---------------------------------------------------------------- icons
var I = {
  zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  unlock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
  camera:'<line x1="2" x2="22" y1="2" y2="22"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><line x1="13.5" x2="6" y1="13.5" y2="21"/><line x1="18" x2="21" y1="12" y2="15"/><path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.05-.22 1.41-.59"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/>'
};
function svg(n,cls){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(cls?' class="'+cls+'"':'')+'>'+I[n]+'</svg>';
}

// ---------------------------------------------------------------- config
var SEGMENTS = ["X9GKV","G6GQY","C9RTP","W6HJT","J6FFZ"];
var CAR_IMAGE_URL = "";   // set to a hosted image URL to show the real photo
var REVEAL_MS = 1900;

var QUESTIONS = [
  { kind:"mc", category:"Formula 1",
    prompt:"Michael Schumacher and Lewis Hamilton are tied at the top with 7 world titles each. Who sits THIRD on the all-time championship list with 5?",
    options:["Alain Prost","Juan Manuel Fangio","Sebastian Vettel","Ayrton Senna"], correct:1,
    hint:"He dominated the 1950s — and won his titles driving for four different teams." },

  { kind:"text", category:"Car Spotter",
    prompt:"Identify the exact make and model from this zoomed-in detail.",
    accepted:["toyota supra","supra","supra mk4","mk4 supra","toyota supra mk4"],
    hint:"A Japanese legend of the 1990s — its 2JZ engine is the stuff of tuner folklore.",
    image:true, placeholder:"e.g. Ferrari F40" },

  { kind:"mc", category:"UGA Bulldogs",
    prompt:"The Georgia Bulldogs went back-to-back, winning College Football Playoff National Championships in which two seasons?",
    options:["2019 & 2020","2020 & 2021","2021 & 2022","2022 & 2023"], correct:2,
    hint:"Stetson Bennett — the walk-on turned legend — was the quarterback for both runs." },

  { kind:"mc", category:"NBA Finals",
    prompt:"Game 7, 2016 NBA Finals: LeBron James delivers 'The Block' — an iconic chase-down rejection. Which Warrior did he stuff?",
    options:["Stephen Curry","Klay Thompson","Harrison Barnes","Andre Iguodala"], correct:3,
    hint:"The 2015 Finals MVP — a defensive specialist, not a Splash Brother." },

  { kind:"text", category:"Final Gauntlet",
    prompt:"What is your favorite drink at Cloud?",
    accepted:[], hint:null, placeholder:"Type your answer… carefully.", fakeOut:true }
];

function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function isCorrectText(raw,q){
  if(raw.trim().length===0) return false;
  // Fake-out is checked before normalizing so emoji / punctuation / any script counts.
  if(q.fakeOut) return true;
  var v = normalize(raw);
  if(!v) return false;
  return q.accepted.some(function(a){ var t=normalize(a); return v===t || v.indexOf(t)!==-1; });
}

// ---------------------------------------------------------------- state
var S = { i:0, phase:"question", justRevealed:-1, picked:-1, text:"", hint:false, err:false, copied:false };
var timer=null, copyTimer=null;
var root = document.getElementById("game");

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function codeHTML(unlocked, justNew){
  var h="";
  for(var i=0;i<SEGMENTS.length;i++){
    var on = i<unlocked;
    h+='<div class="seg-grp"><span class="seg'+(on?" on":"")+(i===justNew?" new":"")+'">'+(on?SEGMENTS[i]:"?????")+'</span>';
    if(i<SEGMENTS.length-1) h+='<span class="dash'+(on?" on":"")+'">-</span>';
    h+='</div>';
  }
  return h;
}

function render(){
  if(S.phase==="victory"){ renderWin(); return; }

  var q = QUESTIONS[S.i];
  var revealing = S.phase==="revealing";
  var unlocked = revealing ? S.i+1 : S.i;
  var danger = q.kind==="text" && q.fakeOut;

  var h = '';
  h += '<header class="hd">';
  h +=   '<div class="eyebrow">'+svg("zap")+'Horizon Festival Presents'+svg("zap")+'</div>';
  h +=   '<h1>Code Vault</h1>';
  h +=   '<p class="sub">5 questions. 5 segments. 1 Forza Horizon code.</p>';
  h += '</header>';

  h += '<section class="vault" aria-label="Game code progress">';
  h +=   '<div class="vault-label">'+svg(unlocked>=5?"unlock":"lock")+unlocked+'/5 segments decrypted</div>';
  h +=   '<div class="code">'+codeHTML(unlocked,S.justRevealed)+'</div>';
  h += '</section>';

  h += '<div class="lights">';
  for(var k=0;k<QUESTIONS.length;k++){
    var done=k<S.i, now=k===S.i;
    h += '<div class="light-col'+((done||now)?" lit":"")+'"><div class="bulb'+(done?" done":now?" now":"")+'"></div><span>Q'+(k+1)+'</span></div>';
  }
  h += '</div>';

  h += '<div class="card'+(danger?" danger":S.err?" err":"")+'" id="card">';
  h +=   '<div class="speedline"><i></i></div>';
  h +=   '<div class="card-body">';
  h +=     '<div class="meta"><span class="chip'+(danger?" danger":"")+'">'+(danger?svg("shield"):"")+esc(q.category)+'</span>';
  h +=       '<span class="counter">Question '+(S.i+1)+' / '+QUESTIONS.length+'</span></div>';

  if(danger){
    h += '<div class="warnbox" role="alert"><div class="warnhd">'+svg("warn")+'<b>Warning — Single Attempt Protocol</b>'+svg("warn")+'</div>';
    h +=   '<p>You only get <u>ONE</u> chance to answer this correctly. There is only <u>ONE</u> true answer. Choose wisely.</p></div>';
  }

  h += '<h2 class="prompt" id="prompt" tabindex="-1">'+esc(q.prompt)+'</h2>';

  if(q.image){
    if(CAR_IMAGE_URL){
      h += '<div class="photo"><img src="'+esc(CAR_IMAGE_URL)+'" alt="Zoomed-in detail of a mystery car"></div>';
    } else {
      h += '<div class="photo">'+svg("camera")+'<b>Photo slot — awaiting upload</b><span>The zoomed-in car shot drops in here. Answer from the hint for now.</span></div>';
    }
  }

  if(q.kind==="mc"){
    h += '<div class="opts">';
    for(var j=0;j<q.options.length;j++){
      h += '<button type="button" class="opt" data-pick="'+j+'" aria-pressed="'+(S.picked===j)+'"'+(revealing?" disabled":"")+'>';
      h +=   '<kbd>'+String.fromCharCode(65+j)+'</kbd>'+esc(q.options[j])+'</button>';
    }
    h += '<button type="button" class="go" id="submit"'+(S.picked<0||revealing?" disabled":"")+'>Lock It In'+svg("chev")+'</button>';
    h += '</div>';
  } else {
    h += '<form id="form" autocomplete="off"><input type="text" class="answer'+(danger||S.err?" danger":"")+'" id="answer" aria-label="Your answer" '+
         'placeholder="'+esc(q.placeholder)+'" spellcheck="false" value="'+esc(S.text)+'"'+(revealing?" disabled":"")+'>';
    h += '<button type="submit" class="go'+(danger?" danger":"")+'" id="submit"'+(!S.text.trim()||revealing?" disabled":"")+'>'+
         (danger?"Submit Final Answer":"Lock It In")+svg("chev")+'</button></form>';
  }

  h += '<div class="fb"><div aria-live="polite">';
  if(revealing) h += '<span class="status good">'+svg("unlock")+'Correct — segment '+(S.i+1)+' decrypted!</span>';
  else if(S.err) h += '<span class="status bad">'+svg("warn")+'Wrong answer. Re-grip and try again.</span>';
  h += '</div>';
  if(q.hint && !revealing){
    h += '<button type="button" class="hintbtn" id="hintbtn">'+svg("bulb")+(S.hint?"Hide hint":"Need a hint?")+'</button>';
  }
  h += '</div>';
  if(S.hint && q.hint && !revealing) h += '<div class="hint">'+esc(q.hint)+'</div>';

  h +=   '</div></div>';
  h += '<footer class="foot"><p>Answer all 5 to claim your code</p></footer>';

  root.innerHTML = h;
  bind();
}

function bind(){
  var q = QUESTIONS[S.i];
  Array.prototype.forEach.call(root.querySelectorAll("[data-pick]"), function(b){
    b.addEventListener("click", function(){ S.picked = +b.dataset.pick; S.err=false; render(); });
  });
  var sub = root.querySelector("#submit");
  if(q.kind==="mc" && sub) sub.addEventListener("click", function(){
    if(S.picked<0) return;
    S.picked===q.correct ? correct() : wrong();
  });
  var form = root.querySelector("#form");
  if(form){
    var input = root.querySelector("#answer");
    input.addEventListener("input", function(){
      S.text = input.value;
      S.err = false;
      var b = root.querySelector("#submit");
      if(b) b.disabled = !S.text.trim();
      input.classList.toggle("danger", !!(q.fakeOut));
    });
    form.addEventListener("submit", function(e){
      e.preventDefault();
      if(!S.text.trim()) return;
      isCorrectText(S.text,q) ? correct() : wrong();
    });
  }
  var hb = root.querySelector("#hintbtn");
  if(hb) hb.addEventListener("click", function(){ S.hint=!S.hint; render(); });
}

function correct(){
  S.err=false; S.phase="revealing"; S.justRevealed=S.i;
  render();
  timer = setTimeout(function(){
    S.justRevealed=-1;
    if(S.i+1>=QUESTIONS.length){ S.phase="victory"; render(); }
    else{
      S.i++; S.picked=-1; S.text=""; S.hint=false; S.phase="question";
      render();
      var p = root.querySelector("#prompt"); if(p) p.focus();
    }
  }, REVEAL_MS);
}

function wrong(){
  S.err = true;
  render();
  var card = root.querySelector("#card");
  if(card){
    card.classList.remove("shake");
    void card.offsetWidth;      // reflow so the animation restarts every time
    card.classList.add("shake");
  }
  var input = root.querySelector("#answer");
  if(input){ input.focus(); input.select(); }
}

function renderWin(){
  var full = SEGMENTS.join("-");
  var h = '<div class="win">';
  h += '<div class="sparks" aria-hidden="true">';
  for(var i=0;i<18;i++){
    var left=(i*137)%100, delay=((i*53)%40)/10, dur=2.4+((i*31)%22)/10, size=2+((i*7)%3), red=i%5===0;
    h += '<span class="spark" style="left:'+left+'%;width:'+size+'px;height:'+size+'px;animation-delay:'+delay+
         's;animation-duration:'+dur+'s;background:'+(red?"#ff2743":"#00d9ff")+';box-shadow:0 0 6px '+(red?"rgba(255,39,67,.9)":"rgba(0,217,255,.9)")+'"></span>';
  }
  h += '</div><div class="win-inner">';
  h += '<div class="trophies">'+svg("flag")+svg("trophy","cup")+svg("flag")+'</div>';
  h += '<div><h2 tabindex="-1" id="wintitle">Code Unlocked</h2>';
  h += '<p class="lede">Checkered flag. All 5 segments decrypted — your Forza Horizon code is ready to redeem.</p></div>';
  h += '<div class="win-code"><div class="vault-label">'+svg("unlock")+'25-character game code</div>';
  h += '<div class="code">'+codeHTML(5,-1)+'</div></div>';
  h += '<button type="button" class="copy'+(S.copied?" done":"")+'" id="copy">'+
       (S.copied?svg("check")+"Copied!":svg("copy")+"Copy to Clipboard")+'</button>';
  h += '<p class="outro">Redeem it in the Microsoft Store and floor it. See you on the open road. 🏁</p>';
  h += '</div></div>';
  root.innerHTML = h;

  var t = root.querySelector("#wintitle"); if(t) t.focus();
  root.querySelector("#copy").addEventListener("click", function(){
    copy(full).then(function(ok){
      if(!ok) return;
      S.copied = true; renderWin();
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function(){ S.copied=false; renderWin(); }, 2500);
    });
  });
}

function copy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(function(){return true;}).catch(function(){return legacy(text);});
  }
  return Promise.resolve(legacy(text));
}
function legacy(text){
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  var ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  finally{ document.body.removeChild(ta); }
  return ok;
}

render();
})();
</script>
